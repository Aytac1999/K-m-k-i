name: Windows setup (Gomruk-Setup.exe)

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chrome for Testing (Stable, win64) yukle
        shell: pwsh
        run: |
          $j = Invoke-RestMethod "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          $u = ($j.channels.Stable.downloads.chrome | Where-Object { $_.platform -eq "win64" }).url
          Write-Host "Chrome for Testing: $u"
          Invoke-WebRequest $u -OutFile cft.zip
          Expand-Archive cft.zip -DestinationPath build\cft
          Get-ChildItem build\cft

      - name: Extension fayllarini hazirla
        shell: pwsh
        run: |
          robocopy . build\extension /E /XD .git .github desktop build out /XF README.md
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }

      - name: Inno Setup qur
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Setup.exe yarat
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc desktop\setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: Gomruk-Setup
          path: out/Gomruk-Setup.exe

      - name: Release-ə yukle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Gomruk Komekcisi - Windows setup
          body: "Gomruk-Setup.exe: iki dəfə klikləyib quraşdırın."
          files: out/Gomruk-Setup.exe
